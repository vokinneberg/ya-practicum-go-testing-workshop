services:
  postgres:
    image: postgres:latest
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./data/seeds.sql:/docker-entrypoint-initdb.d/seeds.sql

  wait:
    image: dokku/wait

volumes:
  db_data: